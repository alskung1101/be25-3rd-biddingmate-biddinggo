apiVersion: apps/v1
kind: Deployment
metadata:
  name: biddinggo-frontend
  namespace: biddinggo
  labels:
    app: biddinggo-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biddinggo-frontend
  template:
    metadata:
      labels:
        app: biddinggo-frontend
    spec:
      containers:
        - name: frontend
          image: alskung/biddinggo-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
